<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Production Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', 'Gothic A1', sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            letter-spacing: 0.05em;
        }
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            text-align: center;
            padding: 4rem 1rem 3rem 1rem;
            position: relative;
            overflow: hidden;
        }
        .header h1 {
            margin: 0;
            font-size: 3.5rem;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #e0e0e0, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInDown 1.2s ease-out;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .thumbnails {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 3rem auto;
            max-width: 1200px;
            padding: 0 2rem;
        }
        .thumbnail {
            width: calc(33.333% - 2rem);
            min-width: 300px;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            background: #2d2d2d;
            animation: fadeIn 1s ease-out;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
        }
        .thumbnail:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
        }
        .thumbnail-number {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            z-index: 2;
        }
        .sort-controls {
            text-align: center;
            margin: 2rem 0;
        }
        .sort-controls button {
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            color: #fff;
            border: 1px solid #404040;
            padding: 12px 24px;
            margin: 0 10px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }
        .sort-controls button:hover {
            background: linear-gradient(135deg, #404040 0%, #2d2d2d 100%);
            transform: translateY(-2px);
        }
        .modal-content {
            background: #2d2d2d;
            color: #e0e0e0;
        }
        .work-details {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 8px;
        }

        /* モーダルウィンドウのスタイル */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .modal-content {
            position: relative;
            width: 80%;
            max-width: 900px;
            margin: 30px auto;  /* 上下マージンを調整 */
            background: #2d2d2d;
            padding: 40px 20px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 80vh;  /* ビューポートの高さの80%を最小の高さとして設定 */
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            flex: 1;  /* 残りの空間を埋める */
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .close-button {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 36px;
            height: 36px;
            background: #1a1a1a;
            border: 2px solid #404040;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            color: #e0e0e0;
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .close-button:hover {
            background: #404040;
            transform: scale(1.1);
        }

        .work-details {
            padding: 25px;
            background: #1a1a1a;
            border-radius: 8px;
            margin-top: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .work-details h2 {
            color: #808080;  /* グレーに変更 */
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            width: 100%;
        }

        .work-details p {
            color: #808080;  /* グレーに変更 */
            line-height: 1.6;
            margin: 0;
            width: 100%;
        }

        .work-details {
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* パーティクル用のスタイル */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.5;
        }
        
        /* レスポンシブデザイン用のスタイル */
        @media screen and (max-width: 1024px) {
            .thumbnails {
                padding: 0 1rem;
            }
            .thumbnail {
                width: calc(50% - 1rem);
                margin-bottom: 1rem;
            }
            .modal-content {
                width: 95%;
                margin: 20px auto;
            }
        }

        @media screen and (max-width: 640px) {
            .header h1 {
                font-size: 2rem;
            }
            .thumbnails {
                gap: 1rem;
            }
            .thumbnail {
                width: 100%;
                min-width: auto;
            }
            .sort-controls button {
                width: 100%;
                margin: 0.5rem 0;
            }
            .work-details {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Video Production Portfolio</h1>
    </div>
    <div class="thumbnails">
        <div class="thumbnail" data-number="1" onclick="openModal('DED2OGgijvI', 'プロモーション動画 #1', 'クライアント様の企業PRビデオです。')">
            <div class="thumbnail-number">1</div>
            <img src="https://picsum.photos/800/600?random=1" alt="Thumbnail 1">
        </div>
        <div class="thumbnail" data-number="2" onclick="openModal('', 'クリエイティブワーク #2', '創造的な映像作品です。')">
            <div class="thumbnail-number">2</div>
            <img src="https://picsum.photos/800/600?random=2" alt="Thumbnail 2">
        </div>
        <div class="thumbnail" data-number="3" onclick="openModal('', 'ブランド映像 #3', 'ブランディング用の映像コンテンツです。')">
            <div class="thumbnail-number">3</div>
            <img src="https://picsum.photos/800/600?random=3" alt="Thumbnail 3">
        </div>
        <div class="thumbnail" data-number="4" onclick="openModal('', 'ブランド映像 #4', 'ブランディング用の映像コンテンツです。')">
            <div class="thumbnail-number">4</div>
            <img src="https://picsum.photos/800/600?random=4" alt="Thumbnail 4">
        </div>
        <div class="thumbnail" data-number="5" onclick="openModal('', 'ブランド映像 #5', 'ブランディング用の映像コンテンツです。')">
            <div class="thumbnail-number">5</div>
            <img src="https://picsum.photos/800/600?random=5" alt="Thumbnail 5">
        </div>
        <div class="thumbnail" data-number="6" onclick="openModal('', 'ブランド映像 #6', 'ブランディング用の映像コンテンツです。')">
            <div class="thumbnail-number">6</div>
            <img src="https://picsum.photos/800/600?random=6" alt="Thumbnail 6">
        </div>
    </div>

    <!-- 並び替えコントロール -->
    <div class="sort-controls">
        <button onclick="sortThumbnails('asc')">昇順に並び替え</button>
        <button onclick="sortThumbnails('desc')">降順に並び替え</button>
    </div>

    <!-- モーダルウィンドウ -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <div class="video-container">
                <iframe id="modalVideo" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="work-details">
                <h2 id="workTitle"></h2>
                <p id="workDescription"></p>
            </div>
        </div>
    </div>

    <script>
        function openModal(videoId, title, description) {
            const modal = document.getElementById('videoModal');
            const videoFrame = document.getElementById('modalVideo');
            const workTitle = document.getElementById('workTitle');
            const workDescription = document.getElementById('workDescription');
            
            videoFrame.src = `https://www.youtube.com/embed/${videoId}`;
            workTitle.textContent = title;
            workDescription.textContent = description;
            
            modal.style.display = 'block';
        }

        function closeModal() {
            const modal = document.getElementById('videoModal');
            const videoFrame = document.getElementById('modalVideo');
            videoFrame.src = ''; // 動画を停止
            modal.style.display = 'none';
        }

        // モーダル外クリックで閉じる
        window.onclick = function(event) {
            const modal = document.getElementById('videoModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        function sortThumbnails(order) {
            const thumbnailsContainer = document.querySelector('.thumbnails');
            const thumbnails = Array.from(document.querySelectorAll('.thumbnail'));
            
            thumbnails.sort((a, b) => {
                const aNum = parseInt(a.dataset.number);
                const bNum = parseInt(b.dataset.number);
                return order === 'asc' ? aNum - bNum : bNum - aNum;
            });
            
            thumbnails.forEach(thumbnail => {
                thumbnailsContainer.appendChild(thumbnail);
            });
        }
    </script>
</body>
</html>
